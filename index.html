<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  </style>
  <script id="events" type="application/json">
    [
      {"name": "Wall Street Crash", "date": 1929, "link": "https://en.wikipedia.org/wiki/Wall_Street_crash_of_1929"},
      {"name": "Pearl Harbor Bombing", "date": 1941, "link": "https://en.wikipedia.org/wiki/Attack_on_Pearl_Harbor"},
      {"name": "First Atomic Bombs Used", "date": 1945, "link": "https://en.wikipedia.org/wiki/Trinity_(nuclear_test)"},
      {"name": "Cuban Missile Crisis", "date": 1961, "link": "https://en.wikipedia.org/wiki/Cuban_Missile_Crisis"},
      {"name": "Moon Landing", "date": 1969, "link": "https://en.wikipedia.org/wiki/Moon_landing"},
      {"name": "Black Monday", "date": 1987, "link": "https://en.wikipedia.org/wiki/Black_Monday"},
      {"name": "Dot-com Collapse", "date": 2000, "link": "https://en.wikipedia.org/wiki/Dot-com_bubble"},
      {"name": "9/11", "date": 2001, "link": "https://en.wikipedia.org/wiki/September_11_attacks"},
      {"name": "Housing Collapse", "date": 2006, "link": "https://en.wikipedia.org/wiki/2000s_United_States_housing_bubble"},
      {"name": "COVID-19", "date": 2019, "link": "https://en.wikipedia.org/wiki/COVID-19"}
    ]
  </script>
  <script id="eras", type="application/json">
    [
      {"name": "Roaring 20s", "start": 1920, "end": 1930, "link": "https://en.wikipedia.org/wiki/Roaring_Twenties"},
      {"name": "WWII", "start": 1939, "end": 1945, "link": "https://en.wikipedia.org/wiki/World_War_II"},
      {"name": "Great Depression", "start": 1929, "end": 1939, "link": "https://en.wikipedia.org/wiki/Great_Depression"},
      {"name": "Cold War", "start": 1945, "end": 1991, "link": "https://en.wikipedia.org/wiki/Cold_War"},
      {"name": "Civil Rights Movement", "start": 1954, "end": 1968, "link": "https://en.wikipedia.org/wiki/Civil_rights_movement"},
      {"name": "War on Terror", "start": 2001, "end": 2021, "link": "https://en.wikipedia.org/wiki/War_on_terror"}
    ]
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded

    async function drawGraph() {
      const csv = await d3.csv("https://raw.githubusercontent.com/JoshData/historical-state-population-csv/refs/heads/main/historical_state_population_by_year.csv");
      const data = [...Array(2026-1900).keys().map(e => {return {year: e + 1900, count: 0}})];
      for (const datum of csv)
        data[datum[1950] - 1900].count += +datum[135000];

      const width = document.querySelector("body").offsetWidth;
      const height = 300;
      const margin = 30;

      const [xmin, xmax] = d3.extent(data, d => d.year);
      const x = d3.scaleTime([new Date(xmin, 0), new Date(xmax, 0)], [margin, width - margin]);
      const [ymin, ymax] = d3.extent(data, d => d.count);
      const y = d3.scaleLinear([0, ymax], [height - margin, margin]);

      const svg = d3.create("svg")
          .attr("width", width)
          .attr("height", height);

      let hover; // I hate that this binding works, but apparently this is a pointer
      const tooltip = (x, y, text) => {
        hover.style("visibility", "visible")
            .style("left", x + "px")
            .style("top", (y - hover.node().offsetHeight) + "px")
            .text(text);
      };
      const hideTooltip = _ => {
        hover.style("visibility", "hidden");
      };

      const eras = JSON.parse(document.getElementById("eras").innerText);
      eras.sort((a, b) => (b.end - b.start) - (a.end - a.start));
      for (const era of eras) {
        const start = x(new Date(era.start, 0));
        const end = x(new Date(era.end, 0));
        svg.append("a")
            .attr("href", era.link)
          .append("rect")
            .attr("x", start)
            .attr("y", y(ymax))
            .attr("width", end - start)
            .attr("height", y(0) - y(ymax))
            .attr("fill", "#00000020")
            .attr("rx", 10)
            .attr("ry", 10)
            .attr("stroke", "#000")
            .attr("stroke-width", 2)
            .on("mouseenter", e => tooltip(e.clientX, e.clientY, era.name))
            .on("mousemove", e => tooltip(e.clientX, e.clientY, era.name))
            .on("mouseout", e => hideTooltip());
      }

      let marker;
      let markerRect;
      const area = d3.area(d => x(new Date(d.year, 0)), y(0), d => y(d.count));
      svg.append("path")
          .attr("d", area(data))
          .attr("fill", "#ff000040")
          .attr("stroke", "#f00")
          .attr("stroke-width", 2)
          .on("mouseenter", e => {
            const count = data[x.invert(e.clientX).getFullYear() - xmin].count;
            marker.attr("visibility", "visible")
                .attr("transform", `translate(${e.clientX}, ${y(count)})`)
                .attr("height", y(0) - y(count));
            tooltip(e.clientX, y(count), count);
          })
          .on("mousemove", e => {
            const count = data[x.invert(e.clientX).getFullYear() - xmin].count;
            marker.attr("transform", `translate(${e.clientX}, ${y(count)})`)
                .attr("height", y(0) - y(count));
            tooltip(e.clientX, y(count), count);
          })
          .on("mouseout", e => {
            marker.attr("visibility", "hidden");
            hideTooltip();
          });

      const events = JSON.parse(document.getElementById("events").innerText);
      for (const event of events) {
        svg.append("a")
            .attr("href", event.link)
          .append("circle")
            .attr("cx", x(new Date(event.date, 0)))
            .attr("cy", y(data[event.date - 1900].count))
            .attr("r", 5)
            .attr("stroke-width", 2)
            .attr("fill", "#55f")
            .attr("stroke", "#000")
            .on("mouseenter", e => tooltip(e.clientX, e.clientY, event.name))
            .on("mousemove", e => tooltip(e.clientX, e.clientY, event.name))
            .on("mouseout", e => hideTooltip());
      }

      svg.append("g")
          .attr("transform", "translate(0, " + (height - margin) + ")")
          .call(d3.axisBottom(x).ticks(d3.timeYear.every(25)));

      marker = svg.append("rect")
          .attr("visibility", "hidden")
          .attr("width", 2)
          .attr("pointer-events", "none");

      hover = d3.select("#timeline").append("div")
          .style("pointer-events", "none")
          .style("position", "absolute")
          .style("background", "#fff")
          .style("border", "2px solid #000");
      
      document.getElementById("timeline").appendChild(svg.node());
    }
    drawGraph();
  </script>
  <div id="timeline" style="position: relative;"></div>
</body>
</html>
