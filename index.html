<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  </style>
  <script id="events" type="application/json">
    [
      {"name": "Wall Street Crash", "date": 1929},
      {"name": "Pearl Harbor Bombing", "date": 1941},
      {"name": "First Atomic Bombs Used", "date": 1945},
      {"name": "Cuban Missile Crisis", "date": 1961},
      {"name": "Moon Landing", "date": 1969},
      {"name": "Black Monday", "date": 1987},
      {"name": "Dot-com Collapse", "date": 2000},
      {"name": "9/11", "date": 2001},
      {"name": "Housing Collapse", "date": 2006},
      {"name": "COVID-19", "date": 2019}
    ]
  </script>
  <script id="eras", type="application/json">
    [
      {"name": "Roaring 20s", "start": 1920, "end": 1930},
      {"name": "WWII", "start": 1939, "end": 1945},
      {"name": "Great Depression", "start": 1929, "end": 1939},
      {"name": "Cold War", "start": 1945, "end": 1991},
      {"name": "Civil Rights Movement", "start": 1954, "end": 1968},
      {"name": "War on Terror", "start": 2001, "end": 2021}
    ]
  </script>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded

    async function drawGraph() {
      const csv = await d3.csv("https://raw.githubusercontent.com/JoshData/historical-state-population-csv/refs/heads/main/historical_state_population_by_year.csv");
      const data = [...Array(2026-1900).keys().map(e => {return {year: e + 1900, count: 0}})];
      for (const datum of csv)
        data[datum[1950] - 1900].count += +datum[135000];
      console.log(data);

      const width = document.querySelector("body").offsetWidth;
      const height = 300;
      const margin = 30;

      const [xmin, xmax] = d3.extent(data, d => d.year);
      const x = d3.scaleTime([new Date(xmin, 0), new Date(xmax, 0)], [margin, width - margin]);
      const [ymin, ymax] = d3.extent(data, d => d.count);
      const y = d3.scaleLinear([0, ymax], [height - margin, margin]);

      const svg = d3.create("svg")
          .attr("width", width)
          .attr("height", height);

      const eras = JSON.parse(document.getElementById("eras").innerText);
      eras.sort((a, b) => (b.end - b.start) - (a.end - a.start));
      for (const era of eras) {
        const start = x(new Date(era.start, 0));
        const end = x(new Date(era.end, 0));
        svg.append("rect")
            .attr("x", start)
            .attr("y", y(ymax))
            .attr("width", end - start)
            .attr("height", y(0) - y(ymax))
            .attr("fill", "#00000020");
      }

      let marker; // I hate that this binding works
      let markerRect;
      const area = d3.area(d => x(new Date(d.year, 0)), y(0), d => y(d.count));
      svg.append("path")
          .attr("d", area(data))
          .attr("fill", "#ff000040")
          .on("mouseenter", e => {
            const count = data[x.invert(e.clientX).getFullYear() - xmin].count;
            marker.attr("visibility", "visible");
            marker.attr("transform", `translate(${e.clientX}, ${y(count)})`);
            markerRect.attr("height", y(0) - y(count));
          })
          .on("mousemove", e => {
            const count = data[x.invert(e.clientX).getFullYear() - xmin].count;
            marker.attr("transform", `translate(${e.clientX}, ${y(count)})`);
            markerRect.attr("height", y(0) - y(count));
          })
          .on("mouseout", e => {
            marker.attr("visibility", "hidden");
          });

      const events = JSON.parse(document.getElementById("events").innerText);
      for (const event of events) {
        svg.append("circle")
            .attr("cx", x(new Date(event.date, 0)))
            .attr("cy", y(data[event.date - 1900].count))
            .attr("r", 5)
            .attr("stroke-width", 2)
            .attr("fill", "#00f")
            .attr("stroke", "#000");
      }

      svg.append("g")
          .attr("transform", "translate(0, " + (height - margin) + ")")
          .call(d3.axisBottom(x).ticks(d3.timeYear.every(25)));

      marker = svg.append("g")
          .attr("visibility", "hidden");
      markerRect = marker.append("rect")
          .attr("width", 2)
          .attr("pointer-events", "none");
      
      document.querySelector("body").appendChild(svg.node());
    }
    drawGraph();
  </script>
</body>
</html>
